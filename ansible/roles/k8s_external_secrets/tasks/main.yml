---
- name: Ensure external-secrets namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: external-secrets

- name: Deploy External Secrets Operator via Helm
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: external-secrets
    chart_ref: external-secrets
    chart_repo_url: https://charts.external-secrets.io
    release_namespace: external-secrets
    state: present
  register: helm_eso_res
  until: helm_eso_res is succeeded
  retries: 5
  delay: 5


- name: Wait for ExternalSecrets CRDs to be registered in K8s API
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: clustersecretstores.external-secrets.io
  register: crd_check
  until: crd_check.resources | length > 0
  retries: 15
  delay: 3

- name: Wait for External Secrets webhook to be fully operational
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    namespace: external-secrets
    name: external-secrets-webhook
  register: webhook_deploy
  until:
    - webhook_deploy.resources | length > 0
    - webhook_deploy.resources[0].status.availableReplicas is defined
    - webhook_deploy.resources[0].status.availableReplicas > 0
  retries: 20
  delay: 5

- name: Deploy Vault ExternalSecret sync manifest
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ playbook_dir }}/../k8s-manifests/external-secrets/vault-eso.yaml"
