---
- name: Ensure external-secrets namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: external-secrets

- name: Deploy External Secrets Operator via Helm
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: external-secrets
    chart_ref: external-secrets
    chart_repo_url: https://charts.external-secrets.io
    release_namespace: external-secrets
    state: present
  register: helm_eso_res
  until: helm_eso_res is succeeded
  retries: 5
  delay: 5

- name: Wait for ExternalSecrets CRDs to be registered in K8s API
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: clustersecretstores.external-secrets.io
  register: crd_check
  until: crd_check.resources | length > 0
  retries: 15
  delay: 3

- name: Wait for External Secrets webhook to be fully operational
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    namespace: external-secrets
    name: external-secrets-webhook
  register: webhook_deploy
  until:
    - webhook_deploy.resources | length > 0
    - webhook_deploy.resources[0].status.availableReplicas is defined
    - webhook_deploy.resources[0].status.availableReplicas > 0
  retries: 20
  delay: 5

- name: Set Vault Root Token fact if provided via environment or vars
  ansible.builtin.set_fact:
    active_vault_token: "{{ vault_root_token | default(vault_token | default(lookup('env', 'VAULT_TOKEN'))) }}"

# Vault and K8s are on the same gcp-k8s-vpc — private IP communication.
# IMPORTANT: kubernetes_ca_cert and token_reviewer_jwt are ALWAYS required
# regardless of VPC. They are for TLS verification and TokenReview API calls,
# NOT for network connectivity.
- name: Determine K8s Master PRIVATE IP for Vault Auth Configuration
  ansible.builtin.set_fact:
    k8s_master_api_ip: "{{ hostvars[groups['kube_control_plane'][0]]['ip'] | default(hostvars[groups['kube_control_plane'][0]]['ansible_host']) if (groups['kube_control_plane'] is defined and groups['kube_control_plane'] | length > 0) else '127.0.0.1' }}"

# Extract K8s CA cert from local kubeconfig.
# Vault needs this to verify the TLS certificate of the K8s API server.
# Without it: HTTP 400 "open /var/run/secrets/.../ca.crt: no such file"
- name: Extract K8s Cluster CA certificate from local kubeconfig
  ansible.builtin.command: >
    kubectl config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}'
  register: k8s_ca_b64
  delegate_to: localhost
  changed_when: false
  when: active_vault_token | default('') != ''

- name: Decode K8s CA certificate from base64 to PEM format
  ansible.builtin.set_fact:
    k8s_ca_cert: "{{ k8s_ca_b64.stdout | b64decode }}"
  when:
    - active_vault_token | default('') != ''
    - k8s_ca_b64.stdout | default('') != ''

- name: Ensure external-secrets ServiceAccount has system:auth-delegator ClusterRoleBinding
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: external-secrets-auth-delegator
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:auth-delegator
      subjects:
        - kind: ServiceAccount
          name: external-secrets
          namespace: external-secrets

- name: Create vault-reviewer-token Secret (required for K8s >= 1.24 — tokens no longer auto-created)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vault-reviewer-token
        namespace: external-secrets
        annotations:
          kubernetes.io/service-account.name: external-secrets
      type: kubernetes.io/service-account-token
  when: active_vault_token | default('') != ''

- name: Wait for K8s to populate the reviewer token Secret
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: v1
    kind: Secret
    name: vault-reviewer-token
    namespace: external-secrets
  register: reviewer_secret
  until:
    - reviewer_secret.resources | length > 0
    - reviewer_secret.resources[0].data.token is defined
  retries: 10
  delay: 3
  when: active_vault_token | default('') != ''

- name: Decode reviewer token from K8s Secret
  ansible.builtin.set_fact:
    k8s_reviewer_token: "{{ reviewer_secret.resources[0].data.token | b64decode }}"
  when:
    - active_vault_token | default('') != ''
    - reviewer_secret.resources | length > 0

- name: Enable Kubernetes Auth engine on Vault Server
  ansible.builtin.uri:
    url: "https://vault.dnan.tech:8200/v1/sys/auth/kubernetes"
    method: POST
    headers:
      X-Vault-Token: "{{ active_vault_token }}"
    body_format: json
    body:
      type: "kubernetes"
    status_code: [200, 204, 400]   # 400 = already enabled, ok
    validate_certs: false
  delegate_to: localhost
  when: active_vault_token | default('') != ''
  ignore_errors: true

- name: Configure Vault Kubernetes Auth (private IP + CA cert + reviewer JWT)
  ansible.builtin.uri:
    url: "https://vault.dnan.tech:8200/v1/auth/kubernetes/config"
    method: POST
    headers:
      X-Vault-Token: "{{ active_vault_token }}"
    body_format: json
    body:
      kubernetes_host: "https://{{ k8s_master_api_ip }}:6443"
      kubernetes_ca_cert: "{{ k8s_ca_cert }}"
      token_reviewer_jwt: "{{ k8s_reviewer_token }}"
      disable_iss_validation: true
    status_code: [200, 204]
    validate_certs: false
  delegate_to: localhost
  when:
    - active_vault_token | default('') != ''
    - k8s_ca_cert | default('') != ''
    - k8s_reviewer_token | default('') != ''

- name: Create external-secrets-policy in Vault (read access to all secrets)
  ansible.builtin.uri:
    url: "https://vault.dnan.tech:8200/v1/sys/policies/acl/external-secrets-policy"
    method: POST
    headers:
      X-Vault-Token: "{{ active_vault_token }}"
    body_format: json
    body:
      policy: |
        path "secret/*" {
          capabilities = ["read", "list"]
        }
        path "secret/data/*" {
          capabilities = ["read", "list"]
        }
    status_code: [200, 204]
    validate_certs: false
  delegate_to: localhost
  when: active_vault_token | default('') != ''

- name: Configure external-secrets-role in Vault
  ansible.builtin.uri:
    url: "https://vault.dnan.tech:8200/v1/auth/kubernetes/role/external-secrets-role"
    method: POST
    headers:
      X-Vault-Token: "{{ active_vault_token }}"
    body_format: json
    body:
      bound_service_account_names: ["external-secrets"]
      bound_service_account_namespaces: ["external-secrets"]
      policies: ["default", "external-secrets-policy"]
      ttl: "24h"
    status_code: [200, 204]
    validate_certs: false
  delegate_to: localhost
  when: active_vault_token | default('') != ''

- name: Deploy Vault ExternalSecret sync manifest
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ playbook_dir }}/../../k8s-platform/external-secrets/vault-eso.yaml"
