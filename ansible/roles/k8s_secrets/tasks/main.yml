---
- name: Ensure target namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k8s_namespace }}"

# Secrets (PostgreSQL, GitHub PAT, Docker Registry) are managed dynamically via Vault + External Secrets Operator (vault-eso.yaml)
