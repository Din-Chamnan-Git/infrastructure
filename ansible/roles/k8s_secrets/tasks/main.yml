---
- name: Ensure target namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k8s_namespace }}"

- name: Deploy Cloudflare TLS Secrets
  ansible.builtin.include_tasks: cloudflare.yml

- name: Deploy PostgreSQL Database Secrets
  ansible.builtin.include_tasks: postgres.yml
