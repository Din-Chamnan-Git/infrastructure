---
- name: Deploy PostgreSQL PersistentVolumeClaim (Longhorn Storage)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ playbook_dir }}/../k8s-manifests/database/postgres-pvc.yaml"

- name: Deploy PostgreSQL Headless Service
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ playbook_dir }}/../k8s-manifests/database/postgres-service.yaml"

- name: Deploy PostgreSQL StatefulSet
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ playbook_dir }}/../k8s-manifests/database/postgres-statefulset.yaml"

- name: Deploy Traefik Application Ingress Route
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ playbook_dir }}/../k8s-manifests/networking/ingress.yml"
