---
- name: Ensure longhorn-system namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: longhorn-system

- name: Deploy Longhorn Helm Chart using declarative values
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: longhorn
    chart_ref: longhorn
    chart_repo_url: https://charts.longhorn.io
    chart_version: "1.6.2"
    release_namespace: longhorn-system
    values_files:
      - "{{ playbook_dir }}/../../k8s-platform/storage/longhorn/longhorn-values.yaml"
    state: present
  register: helm_longhorn_res
  until: helm_longhorn_res is succeeded
  retries: 5
  delay: 5




- name: Deploy Longhorn Traefik Ingress
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ playbook_dir }}/../../k8s-platform/storage/longhorn/longhorn-ingress.yml"
