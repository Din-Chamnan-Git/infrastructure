---
- name: Ensure cert-manager namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cert-manager

- name: Deploy cert-manager Helm chart
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: cert-manager
    chart_ref: cert-manager
    chart_repo_url: https://charts.jetstack.io
    release_namespace: cert-manager
    values_files:
      - "{{ playbook_dir }}/../../k8s-platform/cert-manager/cert-manager-values.yaml"
    state: present
  register: helm_certmanager_res
  until: helm_certmanager_res is succeeded
  retries: 5
  delay: 5

- name: Deploy Cloudflare API Token ExternalSecret for cert-manager
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ playbook_dir }}/../../k8s-platform/cert-manager/cloudflare-eso.yaml"

- name: Deploy Let's Encrypt ClusterIssuers (Staging & Production)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ playbook_dir }}/../../k8s-platform/cert-manager/cluster-issuer.yaml"
