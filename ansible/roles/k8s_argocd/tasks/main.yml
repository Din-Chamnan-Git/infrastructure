---
- name: Ensure argocd namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd

- name: Deploy ArgoCD via Helm
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: argocd
    chart_ref: argo-cd
    chart_repo_url: https://argoproj.github.io/argo-helm
    release_namespace: argocd
    values_files:
      - "{{ playbook_dir }}/../../k8s-platform/argocd/argocd-values.yaml"
    state: present
  register: helm_argocd_res
  until: helm_argocd_res is succeeded
  retries: 5
  delay: 5



- name: Deploy ArgoCD Traefik Ingress
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ playbook_dir }}/../../k8s-platform/argocd/argocd-ingress.yaml"

# Note: GitHub repository secret (github-repo-k8s-platform) is synced dynamically from Vault via ExternalSecrets Operator (vault-eso.yaml)



- name: Deploy ArgoCD GitOps Application Resource (go-demo-api)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ playbook_dir }}/../../k8s-apps/argocd/go-demo-api-app.yaml"

- name: Fetch ArgoCD Initial Admin Password
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Secret
    name: argocd-initial-admin-secret
    namespace: argocd
  register: argocd_secret
  until: argocd_secret.resources | length > 0
  retries: 10
  delay: 3
  ignore_errors: true

- name: Display ArgoCD Admin Credentials
  ansible.builtin.debug:
    msg:
      - "===================================================="
      - "🔐 ArgoCD Initial Admin Credentials:"
      - "  URL:      https://argocd.dnan.tech"
      - "  Username: admin"
      - "  Password: {{ argocd_secret.resources[0].data.password | b64decode if (argocd_secret.resources | length > 0) else 'Secret not found or password changed' }}"
      - "===================================================="
