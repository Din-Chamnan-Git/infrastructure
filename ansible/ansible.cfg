[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=100 -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=5
retries = 3

[defaults]
timeout = 60
host_key_checking = False
roles_path = ./roles

[privilege_escalation]
timeout = 60


